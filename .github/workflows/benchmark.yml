name: Turn benchmark diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure production Turn workloads
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          enable-hw-keyboard: false
          disable-animations: true
          script: bash gradlew :app:baselineprofile:connectedBenchmarkReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=me.rerere.baselineprofile.TurnWorkloadBenchmarks --no-parallel --max-workers=1
      - name: Upload diagnostic measurements and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turn-benchmark-diagnostics
          path: |
            app/baselineprofile/build/outputs/connected_android_test_additional_output/
            app/baselineprofile/build/outputs/androidTest-results/
            app/baselineprofile/build/reports/androidTests/

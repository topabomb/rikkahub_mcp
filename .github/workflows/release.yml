name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布到 GitHub Releases（否则仅上传 Artifact）'
        required: false
        default: false
        type: boolean

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: measix-release-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check pinned contracts and tag before building
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.ref_type == 'tag' || inputs.publish_release == true }}
        run: |
          python -m pip install PyYAML==6.0.2
          python -m unittest discover -s tools -p test_android_release.py -v
          VERSION=$(python tools/verify_android_apk.py --check-version)
          TAG="v${VERSION}"
          mkdir -p build
          require_absent() {
            if gh api --include "$1" > build/release-availability.log 2>&1; then
              echo "Release identity is occupied; preserve the original tag/assets" >&2
              exit 1
            elif ! grep -Eq '^HTTP/[0-9.]+ 404' build/release-availability.log; then
              cat build/release-availability.log >&2
              exit 1
            fi
          }
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python tools/verify_android_apk.py --check-version --tag "$GITHUB_REF_NAME"
          elif [[ "$PUBLISH" == "true" ]]; then
            require_absent "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          fi
          if [[ "$PUBLISH" == "true" ]]; then
            require_absent "repos/$GITHUB_REPOSITORY/releases/tags/$TAG"
          fi
          python tools/generate-enterprise-wire.py --check

      - name: Prepare signing files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [[ "${{ github.ref_type }}" == "tag" || "${{ inputs.publish_release }}" == "true" ]]; then
            if [ -z "$KEY_BASE64" ] || [ -z "$SIGNING_CONFIG" ]; then
              echo "KEY_BASE64 and SIGNING_CONFIG are required when publishing a release" >&2
              exit 1
            fi
          fi

          if [ -n "$KEY_BASE64" ]; then
            printf '%s' "$KEY_BASE64" | base64 -d > app/app.key
          fi

          if [ -n "$SIGNING_CONFIG" ]; then
            printf '%s\n' "$SIGNING_CONFIG" > local.properties
          fi

          # 写入 Google Services 配置（如果配置了该 Secret）
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-parallel --max-workers=1

      - name: Verify final APK identity
        env:
          PUBLISH: ${{ github.ref_type == 'tag' || inputs.publish_release == true }}
        run: |
          EXTRA=()
          if [[ "$PUBLISH" == "true" ]]; then
            VERSION=$(python tools/verify_android_apk.py --check-version)
            EXTRA=(--tag "v${VERSION}")
          fi
          APKS=()
          for apk in app/build/outputs/apk/release/*.apk; do
            APKS+=(--apk "$apk")
          done
          python tools/verify_android_apk.py --variant release "${EXTRA[@]}" "${APKS[@]}" > build/apk-verification.json
          zip -r build/android-contracts.zip app/src/test/resources/contracts \
            app/src/main/java/net/weero/measix/pilot/data/enterprise/PlatformWire.kt

      - name: Extract version and changelog
        id: release_info
        run: |
          VERSION=$(jq -r '.versionName' build/apk-verification.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # versionCode
          VERSION_CODE=$(jq -r '.versionCode' build/apk-verification.json)
          echo "versionCode=${VERSION_CODE}" >> $GITHUB_OUTPUT

          # 从 docs/dev/changelog.md 提取对应版本段落作为 Release notes
          CHANGELOG=$(awk -v ver="$VERSION" '/^## / {flag = ($0 ~ "^## " ver)} flag' docs/dev/changelog.md)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release ${VERSION}"
          fi

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          # 发布时间（ISO 8601），用于 version.json 的 publishedAt 字段
          PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "publishedAt=${PUBLISHED_AT}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        id: publish_release
        if: github.ref_type == 'tag' || inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_info.outputs.version }}
          CHANGELOG: ${{ steps.release_info.outputs.changelog }}
        run: |
          printf '%s\n' "$CHANGELOG" > build/release-notes.md
          EXTRA=()
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then EXTRA=(--verify-tag); fi
          # create rejects an occupied release; never upload with replacement/clobber semantics.
          gh release create "v${VERSION}" app/build/outputs/apk/release/*.apk \
            build/apk-verification.json build/android-contracts.zip \
            --target "$GITHUB_SHA" --title "MeasixPilot ${VERSION}" --notes-file build/release-notes.md \
            --latest "${EXTRA[@]}"

      - name: Build downloads JSON and notify website
        if: github.ref_type == 'tag' || inputs.publish_release == true
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_SYNC_TOKEN }}
          VERSION: ${{ steps.release_info.outputs.version }}
          VERSION_CODE: ${{ steps.release_info.outputs.versionCode }}
          PUBLISHED_AT: ${{ steps.release_info.outputs.publishedAt }}
          CHANGELOG: ${{ steps.release_info.outputs.changelog }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.release_info.outputs.version) }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "WEBSITE_SYNC_TOKEN secret is not configured — skipping website notification" >&2
            exit 1
          fi

          # 用 jq 从 APK 文件列表构建 downloads JSON 数组
          # 每项包含 name、url、size（人类可读）
          REPO_URL="https://github.com/topabomb/rikkahub_mcp"
          DOWNLOADS_JSON=$(jq -n '[]')
          for apk in app/build/outputs/apk/release/*.apk; do
            FILENAME=$(basename "$apk")
            BYTES=$(stat -c%s "$apk")
            SIZE_HR=$(numfmt --to=iec --suffix=B "$BYTES")
            URL="${REPO_URL}/releases/download/${TAG}/${FILENAME}"
            DOWNLOADS_JSON=$(echo "$DOWNLOADS_JSON" | jq \
              --arg name "$FILENAME" \
              --arg url "$URL" \
              --arg size "$SIZE_HR" \
              '. + [{name: $name, url: $url, size: $size}]')
          done

          echo "Downloads JSON: $DOWNLOADS_JSON"

          # 通过 repository_dispatch 触发网站项目同步工作流
          # 使用 jq 安全构建完整 JSON payload（处理多行 changelog 转义）
          PAYLOAD=$(jq -n \
            --arg event_type "app-release" \
            --arg version "$VERSION" \
            --arg versionCode "$VERSION_CODE" \
            --arg publishedAt "$PUBLISHED_AT" \
            --arg changelog "$CHANGELOG" \
            --argjson downloads "$DOWNLOADS_JSON" \
            '{
              event_type: $event_type,
              client_payload: {
                version: $version,
                versionCode: $versionCode,
                publishedAt: $publishedAt,
                changelog: $changelog,
                downloads: $downloads
              }
            }')

          echo "Sending repository_dispatch to measix-pilot-website..."
          echo "$PAYLOAD" | gh api repos/topabomb/measix-pilot-website/dispatches --input -
          echo "Website notification sent successfully."

      - name: Upload artifacts (non-release)
        if: github.ref_type != 'tag' && inputs.publish_release != true
        uses: actions/upload-artifact@v4
        with:
          name: MeasixPilot-${{ steps.release_info.outputs.version }}-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            build/apk-verification.json
            build/android-contracts.zip

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f app/app.key local.properties app/google-services.json

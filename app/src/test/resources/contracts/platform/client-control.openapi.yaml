openapi: 3.0.3
info:
  title: MEASIX Client Control API
  version: 1.0.0
paths:
  /api/client/v1/managed/applied:
    put:
      operationId: reportManagedApplied
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedAppliedReport'
      responses:
        '204':
          description: Current session application report recorded; does not renew session or authorize runtime.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/client/v1/portal/grants:
    post:
      operationId: createPortalGrant
      security:
      - bearerAuth: []
      responses:
        '201':
          description: One-use native WebView POST grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalGrant'
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /portal/session/exchange:
    post:
      operationId: exchangePortalGrant
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [ticket]
              properties:
                ticket:
                  type: string
                  minLength: 32
                  maxLength: 128
      responses:
        '303':
          description: Cookie established; navigate to /portal/
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
  /api/portal/v1/session:
    get:
      operationId: getPortalSession
      security:
      - portalCookie: []
      responses:
        '200':
          description: Restricted Portal identity summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSession'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    delete:
      description: Close only this restricted Portal session; exact Origin and CSRF are required.
      operationId: closePortalSession
      security:
      - portalCookie: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Portal session closed; parent session unchanged
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/client/v1/budgets:
    get:
      operationId: getClientBudgets
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Effective budget state for the authenticated enterprise user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBudgetView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/portal/v1/budgets:
    get:
      operationId: getPortalBudgets
      security:
      - portalCookie: []
      responses:
        '200':
          description: Effective budget state for the restricted Portal session owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBudgetView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/portal/v1/usage/summary:
    get:
      operationId: getPortalUsageSummary
      security:
      - portalCookie: []
      responses:
        '200':
          description: Usage summary scoped to the Portal session owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      parameters: &portalUsageFilters
      - &puf_from
        name: from
        in: query
        schema:
          type: string
          format: date-time
      - &puf_to
        name: to
        in: query
        schema:
          type: string
          format: date-time
      - &puf_resourceKind
        name: resourceKind
        in: query
        schema:
          $ref: '#/components/schemas/ResourceKind'
      - &puf_clientProtocol
        name: clientProtocol
        in: query
        schema:
          $ref: '#/components/schemas/UsageClientProtocol'
  /api/portal/v1/usage/trend:
    get:
      operationId: getPortalUsageTrend
      security:
      - portalCookie: []
      responses:
        '200':
          description: Daily self-usage aggregates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageTrend'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      parameters: *portalUsageFilters
  /api/portal/v1/usage/distribution:
    get:
      operationId: getPortalUsageDistribution
      security:
      - portalCookie: []
      responses:
        '200':
          description: Self-usage distribution grouped by resource and protocol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageDistribution'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      parameters: *portalUsageFilters
  /api/portal/v1/usage/requests:
    get:
      operationId: listPortalUsageRequests
      security:
      - portalCookie: []
      responses:
        '200':
          description: Paged self-usage request history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestUsagePage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      - *puf_from
      - *puf_to
      - *puf_resourceKind
      - *puf_clientProtocol
  /api/portal/v1/usage/requests/{requestId}:
    get:
      operationId: getPortalUsageRequest
      security:
      - portalCookie: []
      responses:
        '200':
          description: One request owned by the Portal session user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestUsageView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RequestId'
  /.well-known/measix:
    get:
      operationId: discover
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discovery'
  /api/client/v1/enrollments/exchange:
    post:
      operationId: exchangeEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentExchangeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentExchangeResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/client/v1/sessions/refresh:
    post:
      operationId: refreshSession
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/client/v1/sessions/logout:
    post:
      operationId: logoutSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Logged out
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/client/v1/bootstrap:
    get:
      operationId: bootstrap
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bootstrap'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/client/v1/managed/state:
    get:
      operationId: getManagedState
      security:
      - bearerAuth: []
      parameters:
      - name: X-Measix-Applied-Managed-Generation
        in: header
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedState'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/client/v1/managed/snapshots/{generation}:
    get:
      operationId: getManagedSnapshot
      security:
      - bearerAuth: []
      parameters:
      - name: generation
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Snapshot
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedSnapshot'
        '304':
          description: Not Modified
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/client/v1/enterprise/updates:
    get:
      operationId: listEnterpriseUpdates
      security:
      - bearerAuth: []
      - portalCookie: []
      parameters:
      - name: startDate
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseUpdateFeed'
        '304':
          description: Not Modified
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/client/v1/enterprise/updates/{enterpriseUpdateId}:
    get:
      operationId: getEnterpriseUpdate
      security:
      - bearerAuth: []
      - portalCookie: []
      parameters:
      - name: enterpriseUpdateId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EnterpriseUpdateId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseUpdateItem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
components:
  schemas:
    ManagedAppliedReport:
      type: object
      additionalProperties: false
      required: [managedGeneration, snapshotHash]
      properties:
        managedGeneration:
          type: integer
          minimum: 1
        snapshotHash:
          type: string
          minLength: 1
    PlatformEnrollmentMaterial:
      description: Versioned native scan/paste material; not an HTTP enrollment request. See Control Protocol section 8. The explicit deployment public HTTP/HTTPS origin is used, never the browser origin or an internal Hub/Relay address.
      type: object
      additionalProperties: false
      required: [formatVersion, kind, platformUrl, code, expiresAt]
      properties:
        formatVersion:
          type: integer
          enum: [1]
        kind:
          type: string
          enum: [PLATFORM_ENROLLMENT]
        platformUrl:
          type: string
          format: uri
          maxLength: 1024
        code:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
          pattern: '^\d{4}-\d{2}-\d{2}[Tt](?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d{1,9})?(?:[Zz]|\+00:00)$'

    PortalGrant:
      type: object
      additionalProperties: false
      required: [exchangeUrl, ticket, expiresAt]
      properties:
        exchangeUrl:
          type: string
          format: uri
        ticket:
          type: string
        expiresAt:
          type: string
          format: date-time
    PortalSession:
      type: object
      additionalProperties: false
      required: [deploymentId, userId, deviceId, sessionId, enterpriseName, userDisplayName, expiresAt, sessionIdleExpiresAt, csrfToken]
      properties:
        deploymentId:
          $ref: '#/components/schemas/DeploymentId'
        userId:
          $ref: '#/components/schemas/UserId'
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        sessionId:
          $ref: '#/components/schemas/SessionId'
        enterpriseName:
          type: string
        userDisplayName:
          type: string
        expiresAt:
          type: string
          format: date-time
        sessionIdleExpiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
    DeploymentId:
      type: string
      pattern: ^dep_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    UserId:
      type: string
      pattern: ^usr_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    DeviceId:
      type: string
      pattern: ^dev_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    EnrollmentId:
      type: string
      pattern: ^enr_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    SessionId:
      type: string
      pattern: ^ses_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    InstallationId:
      type: string
      pattern: ^ins_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ProviderId:
      type: string
      pattern: ^prv_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ModelId:
      type: string
      pattern: ^mdl_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    TtsId:
      type: string
      pattern: ^tts_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    AsrId:
      type: string
      pattern: ^asr_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    McpServerId:
      type: string
      pattern: ^mcp_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    PolicyId:
      type: string
      pattern: ^pol_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    DraftId:
      type: string
      pattern: ^drf_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ReleaseId:
      type: string
      pattern: ^rel_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    UpstreamId:
      type: string
      pattern: ^ups_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    SecretId:
      type: string
      pattern: ^sec_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    RuntimeRouteId:
      type: string
      pattern: ^rte_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ActivationId:
      type: string
      pattern: ^act_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    RequestId:
      type: string
      pattern: ^req_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    InteractionId:
      type: string
      pattern: ^int_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    PricingRuleId:
      type: string
      pattern: ^prc_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    IdempotencyKey:
      type: string
      pattern: ^idem_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    AssistantDefinitionId:
      type: string
      pattern: ^asd_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    StarterId:
      type: string
      pattern: ^str_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    EnterpriseUpdateId:
      type: string
      pattern: ^eup_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    Sha256Hash:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    ResourceKind:
      type: string
      enum: [MODEL, TTS, ASR, MCP]
    UsageClientProtocol:
      type: string
      enum:
      - OPENAI_CHAT_COMPLETIONS
      - OPENAI_RESPONSES
      - ANTHROPIC_MESSAGES
      - GOOGLE_GENERATE_CONTENT
      - OPENAI_AUDIO_SPEECH
      - GEMINI_GENERATE_CONTENT_TTS
      - MIMO_CHAT_COMPLETIONS_TTS
      - OPENAI_AUDIO_TRANSCRIPTIONS
      - DASHSCOPE_HTTP_ASR
      - OPENAI_REALTIME_TRANSCRIPTION
      - DASHSCOPE_REALTIME_ASR
      - MCP_STREAMABLE_HTTP
    UsageMeter:
      type: string
      enum: [REQUESTS, INPUT_TOKENS, OUTPUT_TOKENS, CACHED_TOKENS, TOTAL_TOKENS, CHARACTERS, AUDIO_SECONDS]
    UsageCompleteness:
      type: string
      enum: [EXACT, PARTIAL, UNKNOWN]
    BudgetCapability:
      type: string
      enum: [MODEL, TTS, ASR, MCP]
    BudgetMode:
      type: string
      enum: [UNLIMITED, LIMITED]
    BudgetSource:
      type: string
      enum: [DEFAULT, EXPLICIT]
    BudgetPeriod:
      type: string
      enum: [DAY, WEEK, MONTH, LIFETIME]
    BudgetStatus:
      type: string
      enum: [AVAILABLE, EXHAUSTED, PENDING_RECONCILIATION]
    MeterQuantity:
      type: object
      additionalProperties: false
      required: [meter, quantity, completeness]
      properties:
        meter:
          $ref: '#/components/schemas/UsageMeter'
        quantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,9})?$'
        completeness:
          $ref: '#/components/schemas/UsageCompleteness'
    BudgetLimitState:
      type: object
      additionalProperties: false
      required: [period, meter, limit, used, reserved, remaining, overage, scopeStart]
      properties:
        period:
          $ref: '#/components/schemas/BudgetPeriod'
        meter:
          $ref: '#/components/schemas/UsageMeter'
        limit:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,9})?$'
        used:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,9})?$'
        reserved:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,9})?$'
        remaining:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,9})?$'
        overage:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,9})?$'
        scopeStart:
          type: string
          format: date-time
        resetAt:
          type: string
          format: date-time
    BudgetCapabilityView:
      type: object
      additionalProperties: false
      required: [capability, mode, source, revision, effectiveFrom, asOf, inFlightRequests, limits, usageMeters, status]
      properties:
        capability:
          $ref: '#/components/schemas/BudgetCapability'
        resourceId:
          type: string
        mode:
          $ref: '#/components/schemas/BudgetMode'
        source:
          $ref: '#/components/schemas/BudgetSource'
        revision:
          type: integer
          minimum: 0
        effectiveFrom:
          type: string
          format: date-time
        asOf:
          type: string
          format: date-time
        inFlightRequests:
          type: integer
          minimum: 0
        limits:
          type: array
          items:
            $ref: '#/components/schemas/BudgetLimitState'
        usageMeters:
          type: array

            $ref: '#/components/schemas/ManagedAssistantDefinition'
        starters:
          type: array
          items:
            $ref: '#/components/schemas/AssistantStarterDefinitionV4'
    ManagedAssistantDefinition:
      type: object
      additionalProperties: false
      required:
      - assistantDefinitionId
      - displayName
      - systemPrompt
      - modelId
      - memorySeed
      - mcpServerIds
      - enabled
      properties:
        assistantDefinitionId:
          $ref: '#/components/schemas/AssistantDefinitionId'
        displayName:
          type: string
          minLength: 1
        description:
          type: string
        systemPrompt:
          type: string
          minLength: 1
        modelId:
          $ref: '#/components/schemas/ModelId'
        memorySeed:
          type: array
          items:
            type: string
            minLength: 1
        mcpServerIds:
          type: array
          items:
            $ref: '#/components/schemas/McpServerId'
        enabled:
          type: boolean
    AssistantStarterDefinition:
      type: object
      additionalProperties: false
      required:
      - starterId
      - assistantDefinitionId
      - title
      - prompt
      - sortOrder
      - enabled
      - openingSnapshot
      properties:
        starterId:
          $ref: '#/components/schemas/StarterId'
        assistantDefinitionId:
          $ref: '#/components/schemas/AssistantDefinitionId'
        title:
          type: string
          minLength: 1
        prompt:
          type: string
          minLength: 1
        sortOrder:
          type: integer
          minimum: 0
        enabled:
          type: boolean
        openingSnapshot:
          $ref: '#/components/schemas/StarterOpeningSnapshot'
          x-go-type: "*StarterOpeningSnapshot"
          x-omitempty: true
    AssistantStarterDefinitionV4:
      type: object
      additionalProperties: false
      required:
      - starterId
      - assistantDefinitionId
      - title
      - prompt
      - sortOrder
      - enabled
      properties:
        starterId:
          $ref: '#/components/schemas/StarterId'
        assistantDefinitionId:
          $ref: '#/components/schemas/AssistantDefinitionId'
        title:
          type: string
          minLength: 1
        prompt:
          type: string
          minLength: 1
        description:
          type: string
        sortOrder:
          type: integer
          minimum: 0
        enabled:
          type: boolean
    StarterOpeningSnapshot:
      type: object
      additionalProperties: false
      required:
      - format
      - systemPrompt
      - initialContexts
      properties:
        format:
          type: integer
          enum: [1]
        systemPrompt:
          type: string
          description: Frozen effective System resolved at publication. Consume verbatim, including empty text; never inherit or append the current assistant System on the client.
        initialContexts:
          type: array
          x-uniqueProperty: id
          description: Ordered context blocks; IDs must be unique within this opening.
          items:
            $ref: '#/components/schemas/StarterInitialContext'
    StarterInitialContext:
      type: object
      additionalProperties: false
      required:
      - id
      - content
      properties:
        id:
          type: string
          minLength: 1
          pattern: '\S'
        content:
          type: string
    EnterpriseUpdateCategory:
      type: string
      enum:
      - ANNOUNCEMENT
      - MAINTENANCE
      - NOTICE
    EnterpriseUpdateSeverity:
      type: string
      enum:
      - INFO
      - WARNING
      - CRITICAL
    EnterpriseUpdateContentFormat:
      type: string
      enum:
      - MARKDOWN
      - PLAIN
    EnterpriseUpdateItem:
      type: object
      additionalProperties: false
      required:
      - enterpriseUpdateId
      - title
      - content
      - contentFormat
      - category
      - severity
      - publishedAt
      properties:
        enterpriseUpdateId:
          $ref: '#/components/schemas/EnterpriseUpdateId'
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        contentFormat:
          $ref: '#/components/schemas/EnterpriseUpdateContentFormat'
        category:
          $ref: '#/components/schemas/EnterpriseUpdateCategory'
        severity:
          $ref: '#/components/schemas/EnterpriseUpdateSeverity'
        publishedAt:
          type: string
          format: date-time
    EnterpriseUpdateFeed:
      type: object
      additionalProperties: false
      required:
      - enterpriseTimezone
      - items
      - truncated
      properties:
        enterpriseTimezone:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/EnterpriseUpdateItem'
        truncated:
          type: boolean
  responses:
    Problem:
      description: Problem response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    portalCookie:
      type: apiKey
      in: cookie
      name: measix_portal_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

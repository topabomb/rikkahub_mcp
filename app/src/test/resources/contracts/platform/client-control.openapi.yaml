components:
  schemas:
    WorkspaceServiceId:
      type: string
      pattern: ^wss_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    AgentSpaceId:
      type: string
      pattern: ^spc_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    WorkspaceOperationId:
      type: string
      pattern: ^wop_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    WorkspaceFileEntry:
      type: object
      additionalProperties: false
      required:
      - path
      - kind
      properties:
        path:
          type: string
        kind:
          type: string
          enum:
          - FILE
          - DIRECTORY
        size:
          type: integer
          format: int64
          minimum: 0
        modifiedAt:
          type: string
          format: date-time
        etag:
          type: string
    WorkspaceFileList:
      type: object
      additionalProperties: false
      required:
      - entries
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFileEntry'
        usedBytes:
          type: integer
          format: int64
          minimum: 0
        availableBytes:
          type: integer
          format: int64
          minimum: 0
    WorkspaceFileMutation:
      type: object
      additionalProperties: false
      required:
      - action
      - path
      properties:
        action:
          type: string
          enum:
          - MKCOL
          - MOVE
          - COPY
          - DELETE
        path:
          type: string
        destination:
          type: string
        sourceEtag:
          type: string
        targetEtag:
          type: string
        overwrite:
          type: boolean
        recursiveConfirmed:
          type: boolean
    WorkspaceFileFailure:
      type: object
      additionalProperties: false
      required:
      - path
      - status
      - code
      properties:
        path:
          type: string
        status:
          type: integer
        code:
          type: string
    WorkspaceFileResult:
      type: object
      additionalProperties: false
      required:
      - outcome
      - failures
      - truncated
      properties:
        outcome:
          type: string
          enum:
          - SUCCEEDED
          - PARTIAL
          - UNKNOWN
        failures:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFileFailure'
        truncated:
          type: boolean
    WorkspaceProjection:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - serviceState
      - state
      - bindingRevision
      - mcpAvailable
      - filesAvailable
      - mcpReason
      - filesReason
      properties:
        schemaVersion:
          type: integer
          enum:
          - 1
        state:
          type: string
          enum:
          - UNPROVISIONED
          - CONNECTING
          - CONNECTED
          - DISCONNECTING
          - DISCONNECTED
          - RESTORING
          - DELETING
          - DELETED
          - NEEDS_ATTENTION
        bindingRevision:
          type: integer
          minimum: 0
        agentSpaceId:
          $ref: '#/components/schemas/AgentSpaceId'
        mcpServerId:
          $ref: '#/components/schemas/McpServerId'
        mcpAvailable:
          type: boolean
        filesAvailable:
          type: boolean
        mcpReason:
          type: string
        filesReason:
          type: string
        observedAt:
          type: string
          format: date-time
        operationId:
          $ref: '#/components/schemas/WorkspaceOperationId'
        serviceState:
          type: string
          enum:
          - NOT_CONFIGURED
          - DISABLED
          - ENABLED
          description: Configured enable intent, independent of this user lifecycle and remote health. ENABLED does not imply
            filesAvailable.
    ManagedAppliedReport:
      type: object
      additionalProperties: false
      required: [managedGeneration, snapshotHash]
      properties:
        managedGeneration:
          type: integer
          minimum: 1
        snapshotHash:
          type: string
          minLength: 1
    PlatformEnrollmentMaterial:
      description: Versioned native scan/paste material; not an HTTP enrollment request. See Control Protocol section 8. The explicit deployment public HTTP/HTTPS origin is used, never the browser origin or an internal Hub/Relay address.
      type: object
      additionalProperties: false
      required: [formatVersion, kind, platformUrl, code, expiresAt]
      properties:
        formatVersion:
          type: integer
          enum: [1]
        kind:
          type: string
          enum: [PLATFORM_ENROLLMENT]
        platformUrl:
          type: string
          format: uri
          maxLength: 1024
        code:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
          pattern: '^\d{4}-\d{2}-\d{2}[Tt](?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d{1,9})?(?:[Zz]|\+00:00)$'

    PortalGrant:
      type: object
      additionalProperties: false
      required: [exchangeUrl, ticket, expiresAt]
      properties:
        exchangeUrl:
          type: string
          format: uri
        ticket:
          type: string
        expiresAt:
          type: string
          format: date-time
    PortalSession:
      type: object
      additionalProperties: false
      required: [deploymentId, userId, deviceId, sessionId, enterpriseName, userDisplayName, expiresAt, sessionIdleExpiresAt, csrfToken]
      properties:
        deploymentId:
          $ref: '#/components/schemas/DeploymentId'
        userId:
          $ref: '#/components/schemas/UserId'
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        sessionId:
          $ref: '#/components/schemas/SessionId'
        enterpriseName:
          type: string
        userDisplayName:
          type: string
        expiresAt:
          type: string
          format: date-time
        sessionIdleExpiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
    DeploymentId:
      type: string
      pattern: ^dep_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    UserId:
      type: string
      pattern: ^usr_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    DeviceId:
      type: string
      pattern: ^dev_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    EnrollmentId:
      type: string
      pattern: ^enr_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    SessionId:
      type: string
      pattern: ^ses_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    InstallationId:
      type: string
      pattern: ^ins_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ProviderId:
      type: string
      pattern: ^prv_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ModelId:
      type: string
      pattern: ^mdl_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ImageGenerationId:
      type: string
      pattern: ^img_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    TtsId:
      type: string
      pattern: ^tts_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    AsrId:
      type: string
      pattern: ^asr_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    McpServerId:
      type: string
      pattern: ^mcp_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    PolicyId:
      type: string
      pattern: ^pol_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    DraftId:
      type: string
      pattern: ^drf_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ReleaseId:
      type: string
      pattern: ^rel_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    UpstreamId:
      type: string
      pattern: ^ups_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    SecretId:
      type: string
      pattern: ^sec_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    RuntimeRouteId:
      type: string
      pattern: ^rte_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ActivationId:
      type: string
      pattern: ^act_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    RequestId:
      type: string
      pattern: ^req_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    InteractionId:
      type: string
      pattern: ^int_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    PricingRuleId:
      type: string
      pattern: ^prc_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    IdempotencyKey:
      type: string
      pattern: ^idem_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    AssistantDefinitionId:
      type: string
      pattern: ^asd_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    StarterId:
      type: string
      pattern: ^str_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    EnterpriseUpdateId:
      type: string
      pattern: ^eup_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    Sha256Hash:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    ResourceKind:
      type: string
      enum: [MODEL, TTS, ASR, MCP, IMAGE_GENERATION]
    UsageClientProtocol:
      type: string
      enum:
      - OPENAI_CHAT_COMPLETIONS
      - OPENAI_RESPONSES
      - ANTHROPIC_MESSAGES
      - GOOGLE_GENERATE_CONTENT
      - OPENAI_IMAGES_GENERATIONS
      - DASHSCOPE_MULTIMODAL_GENERATION
      - OPENAI_AUDIO_SPEECH
      - GEMINI_GENERATE_CONTENT_TTS
      - MIMO_CHAT_COMPLETIONS_TTS
      - OPENAI_AUDIO_TRANSCRIPTIONS
      - DASHSCOPE_HTTP_ASR
      - OPENAI_REALTIME_TRANSCRIPTION
      - DASHSCOPE_REALTIME_ASR
      - MCP_STREAMABLE_HTTP
    UsageMeter:
      type: string
      enum: [REQUESTS, REQUESTED_IMAGES, INPUT_TOKENS, OUTPUT_TOKENS, CACHED_TOKENS, TOTAL_TOKENS, CHARACTERS, AUDIO_SECONDS]
    UsageCompleteness:
      type: string
      enum: [EXACT, PARTIAL, UNKNOWN]
    BudgetCapability:
      type: string
      enum: [MODEL, TTS, ASR, MCP, IMAGE_GENERATION]
    BudgetMode:
      type: string
      enum: [UNLIMITED, LIMITED]
    BudgetSource:
      type: string
      enum: [DEFAULT, EXPLICIT]
    BudgetPeriod:
      type: string
      enum: [DAY, WEEK, MONTH, LIFETIME]
    BudgetStatus:
      type: string
      enum: [AVAILABLE, EXHAUSTED, PENDING_RECONCILIATION]
    MeterQuantity:
      type: object
      additionalProperties: false
      required: [meter, quantity, completeness]
      properties:
        meter:
          $ref: '#/components/schemas/UsageMeter'
        quantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,9})?$'
        completeness:
          $ref: '#/components/schemas/UsageCompleteness'
    BudgetLimitState:
      type: object
      additionalProperties: false
      required: [period, meter, limit, used, reserved, remaining, overage, scopeStart]
      properties:
        period:
          $ref: '#/components/schemas/BudgetPeriod'
        meter:
          $ref: '#/components/schemas/UsageMeter'
        limit:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,9})?$'
        used:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,9})?$'
        reserved:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,9})?$'
        remaining:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,9})?$'
        overage:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,9})?$'
        scopeStart:
          type: string
          format: date-time
        resetAt:
          type: string
          format: date-time
    BudgetCapabilityView:
      type: object
      additionalProperties: false
      required: [capability, mode, source, revision, effectiveFrom, asOf, inFlightRequests, limits, usageMeters, status]
      properties:
        capability:
          $ref: '#/components/schemas/BudgetCapability'
        mode:
          $ref: '#/components/schemas/BudgetMode'
        source:
          $ref: '#/components/schemas/BudgetSource'
        revision:
          type: integer
          minimum: 0
        effectiveFrom:
          type: string
          format: date-time
        asOf:
          type: string
          format: date-time
        inFlightRequests:
          type: integer
          minimum: 0
        limits:

        '423':
          description: file_locked; verify the lock before retrying. Preserve edits.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: file_transfer_limit; bounded concurrent transfers exceeded. Queue reads; do not replay writes automatically.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: workspace_unavailable, dav_credential_unavailable, file_service_unavailable, file_transport_unavailable

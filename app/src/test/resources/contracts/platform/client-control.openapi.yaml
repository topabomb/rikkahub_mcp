openapi: 3.0.3
info:
  title: MEASIX Client Control API
  version: 1.0.0
  description: >-
    Discovery, Enrollment, Bootstrap (including Managed State), Refresh, Logout and identity Problems
    form a stable control profile independent of Snapshot schema versions. Publishing a newer Snapshot
    must not require a client to understand that configuration before restoring identity, refreshing
    credentials or logging out. Changes to this profile require verification with supported client builds;
    even optional additions can break strict consumers. Breaking control changes require an independently
    versioned API and retention of the supported control path, not automatic Snapshot downgrade.
paths:
  /api/client/v1/managed/applied:
    put:
      operationId: reportManagedApplied
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedAppliedReport'
      responses:
        '204':
          description: Current session application report recorded; does not renew session or authorize runtime.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/client/v1/portal/grants:
    post:
      operationId: createPortalGrant
      security:
      - bearerAuth: []
      responses:
        '201':
          description: One-use native WebView POST grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalGrant'
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /portal/session/exchange:
    post:
      operationId: exchangePortalGrant
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [ticket]
              properties:
                ticket:
                  type: string
                  minLength: 32
                  maxLength: 128
      responses:
        '303':
          description: Cookie established; navigate to /portal/
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
  /api/portal/v1/session:
    get:
      operationId: getPortalSession
      security:
      - portalCookie: []
      responses:
        '200':
          description: Restricted Portal identity summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSession'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    delete:
      description: Close only this restricted Portal session; exact Origin and CSRF are required.
      operationId: closePortalSession
      security:
      - portalCookie: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Portal session closed; parent session unchanged
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/client/v1/budgets:
    get:
      operationId: getClientBudgets
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Effective budget state for the authenticated enterprise user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBudgetView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/portal/v1/budgets:
    get:
      operationId: getPortalBudgets
      security:
      - portalCookie: []
      responses:
        '200':
          description: Effective budget state for the restricted Portal session owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBudgetView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/portal/v1/usage/summary:
    get:
      operationId: getPortalUsageSummary
      security:
      - portalCookie: []
      responses:
        '200':
          description: Usage summary scoped to the Portal session owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      parameters: &portalUsageFilters
      - &puf_from
        name: from
        in: query
        schema:
          type: string
          format: date-time
      - &puf_to
        name: to
        in: query
        schema:
          type: string
          format: date-time
      - &puf_resourceKind
        name: resourceKind
        in: query
        schema:
          $ref: '#/components/schemas/ResourceKind'
      - &puf_clientProtocol
        name: clientProtocol
        in: query
        schema:
          $ref: '#/components/schemas/UsageClientProtocol'
  /api/portal/v1/usage/trend:
    get:
      operationId: getPortalUsageTrend
      security:
      - portalCookie: []
      responses:
        '200':
          description: Daily self-usage aggregates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageTrend'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      parameters: *portalUsageFilters
  /api/portal/v1/usage/distribution:
    get:
      operationId: getPortalUsageDistribution
      security:
      - portalCookie: []
      responses:
        '200':
          description: Self-usage distribution grouped by resource and protocol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageDistribution'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      parameters: *portalUsageFilters
  /api/portal/v1/usage/requests:
    get:
      operationId: listPortalUsageRequests
      security:
      - portalCookie: []
      responses:
        '200':
          description: Paged self-usage request history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestUsagePage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      - *puf_from
      - *puf_to
      - *puf_resourceKind
      - *puf_clientProtocol
  /api/portal/v1/usage/requests/{requestId}:
    get:
      operationId: getPortalUsageRequest
      security:
      - portalCookie: []
      responses:
        '200':
          description: One request owned by the Portal session user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestUsageView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RequestId'
  /.well-known/measix:
    get:
      operationId: discover
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discovery'
  /api/client/v1/enrollments/exchange:
    post:
      operationId: exchangeEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentExchangeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentExchangeResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/client/v1/sessions/refresh:
    post:
      operationId: refreshSession
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/client/v1/sessions/logout:
    post:
      operationId: logoutSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Logged out
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/client/v1/bootstrap:
    get:
      operationId: bootstrap
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bootstrap'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/client/v1/managed/state:
    get:
      operationId: getManagedState
      security:
      - bearerAuth: []
      parameters:
      - name: X-Measix-Applied-Managed-Generation
        in: header
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedState'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/client/v1/managed/snapshots/{generation}:
    get:
      operationId: getManagedSnapshot
      security:
      - bearerAuth: []
      parameters:
      - name: generation
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Snapshot
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ManagedSnapshot'
                - $ref: '#/components/schemas/ManagedSnapshotV4'
        '304':
          description: Not Modified
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/client/v1/enterprise/updates:
    get:
      operationId: listEnterpriseUpdates
      security:
      - bearerAuth: []
      - portalCookie: []
      parameters:
      - name: startDate
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseUpdateFeed'
        '304':
          description: Not Modified
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/client/v1/enterprise/updates/{enterpriseUpdateId}:
    get:
      operationId: getEnterpriseUpdate
      security:
      - bearerAuth: []
      - portalCookie: []
      parameters:
      - name: enterpriseUpdateId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EnterpriseUpdateId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseUpdateItem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/client/v1/workspace:
    get:
      operationId: getWorkspace
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceProjection'
        default:
          $ref: '#/components/responses/Problem'
  /api/client/v1/workspace/files:
    get:
      operationId: listClientWorkspaceFiles
      parameters:
      - name: path
        in: query
        required: false
        schema:
          type: string
      - name: agentSpaceId
        in: query
        required: true
        description: Expected space from WorkspaceProjection; mismatch is 409. Never selects a user.
        schema:
          $ref: '#/components/schemas/AgentSpaceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileList'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          description: invalid_file_path, invalid_file_condition, file_condition_required, invalid_file_destination or invalid_workspace_request;
            correct the request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Core authentication invalid. Refresh/sign in through the existing session lifecycle.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Core permission denied.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: file_not_found; refresh parent. Missing deployment routes are not an empty directory.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: workspace_space_mismatch or file_conflict; refresh the target and preserve edits.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: file_version_conflict; HTTP or DAV precondition failed. Preserve edits and never overwrite automatically.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: file_locked; verify the lock before retrying. Preserve edits.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: file_transfer_limit; bounded concurrent transfers exceeded. Queue reads; do not replay writes automatically.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: workspace_unavailable, dav_credential_unavailable, file_service_unavailable, file_transport_unavailable
            or workspace_result_unknown. DAV failures do not invalidate Core login. Unknown writes require re-reading; do not
            retry automatically.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '507':
          description: file_storage_full; free space before a new explicit attempt.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: file_listing_limit; directory response exceeds the supported bound, never interpret as empty.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      description: 'Paths are relative to the workspace root, encoded once as query values. Writes are never automatically retried. '
    post:
      operationId: mutateClientWorkspaceFile
      parameters:
      - name: agentSpaceId
        in: query
        required: true
        description: Expected space from WorkspaceProjection; mismatch is 409. Never selects a user.
        schema:
          $ref: '#/components/schemas/AgentSpaceId'
      responses:
        '200':
          description: 'Inspect outcome: SUCCEEDED, PARTIAL or UNKNOWN. HTTP 200 alone does not mean every mutation succeeded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileResult'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          description: invalid_file_path, invalid_file_condition, file_condition_required, invalid_file_destination or invalid_workspace_request;
            correct the request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Core authentication invalid. Refresh/sign in through the existing session lifecycle.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Core permission denied.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: file_not_found; refresh parent. Missing deployment routes are not an empty directory.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: workspace_space_mismatch or file_conflict; refresh the target and preserve edits.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: file_version_conflict; HTTP or DAV precondition failed. Preserve edits and never overwrite automatically.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: file_locked; verify the lock before retrying. Preserve edits.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: file_transfer_limit; bounded concurrent transfers exceeded. Queue reads; do not replay writes automatically.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: workspace_unavailable, dav_credential_unavailable, file_service_unavailable, file_transport_unavailable
            or workspace_result_unknown. DAV failures do not invalidate Core login. Unknown writes require re-reading; do not
            retry automatically.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '507':
          description: file_storage_full; free space before a new explicit attempt.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: file_listing_limit; directory response exceeds the supported bound, never interpret as empty.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceFileMutation'
      description: 'Paths are relative to the workspace root, encoded once as query values. Writes are never automatically retried. '
  /api/client/v1/workspace/content:
    get:
      operationId: downloadClientWorkspaceFile
      parameters:
      - name: path
        in: query
        required: false
        schema:
          type: string
      - name: Range
        in: header
        required: false
        schema:
          type: string
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      - name: agentSpaceId
        in: query
        required: true
        description: Expected space from WorkspaceProjection; mismatch is 409. Never selects a user.
        schema:
          $ref: '#/components/schemas/AgentSpaceId'
      responses:
        '200':
          description: Full content or HEAD metadata.
          headers:
            ETag:
              description: Opaque version of these bytes; preserve quotes. Use with If-Match for editing and resumed downloads.
              schema:
                type: string
            Last-Modified:
              description: Remote HTTP modification date when available.
              schema:
                type: string
            Content-Length:
              description: Response byte length when known.
              schema:
                type: string
            Content-Range:
              description: Selected range for 206.
              schema:
                type: string
            Accept-Ranges:
              description: Remote byte range support.
              schema:
                type: string
            Content-Disposition:
              description: Attachment filename; never execute as same-origin HTML.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
        '400':
          description: invalid_file_path, invalid_file_condition, file_condition_required, invalid_file_destination or invalid_workspace_request;
            correct the request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Core authentication invalid. Refresh/sign in through the existing session lifecycle.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Core permission denied.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: file_not_found; refresh parent. Missing deployment routes are not an empty directory.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: workspace_space_mismatch or file_conflict; refresh the target and preserve edits.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: file_version_conflict; HTTP or DAV precondition failed. Preserve edits and never overwrite automatically.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: file_locked; verify the lock before retrying. Preserve edits.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: file_transfer_limit; bounded concurrent transfers exceeded. Queue reads; do not replay writes automatically.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: workspace_unavailable, dav_credential_unavailable, file_service_unavailable, file_transport_unavailable
            or workspace_result_unknown. DAV failures do not invalidate Core login. Unknown writes require re-reading; do not
            retry automatically.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '507':
          description: file_storage_full; free space before a new explicit attempt.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: file_listing_limit; directory response exceeds the supported bound, never interpret as empty.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '206':
          description: Partial byte range.
          headers:
            ETag:
              description: Opaque version of these bytes; preserve quotes. Use with If-Match for editing and resumed downloads.
              schema:
                type: string
            Last-Modified:
              description: Remote HTTP modification date when available.
              schema:
                type: string
            Content-Length:
              description: Response byte length when known.
              schema:
                type: string
            Content-Range:
              description: Selected range for 206.
              schema:
                type: string
            Accept-Ranges:
              description: Remote byte range support.
              schema:
                type: string
            Content-Disposition:
              description: Attachment filename; never execute as same-origin HTML.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified; no body.
          headers:
            ETag:
              description: Opaque version of these bytes; preserve quotes. Use with If-Match for editing and resumed downloads.
              schema:
                type: string
            Last-Modified:
              description: Remote HTTP modification date when available.
              schema:
                type: string
            Content-Length:
